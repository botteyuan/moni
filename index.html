<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="site.name">小霸王</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="hero-grid"></div>
      <div class="container hero-inner">
        <h1 class="hero-brand" data-i18n="hero.brand">小霸王，其樂無窮</h1>
        <p class="hero-tagline" data-i18n="hero.tagline">願我們找回童年的快樂</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="list.html" data-i18n="hero.browse">浏览全部</a>
          <a class="btn btn-ghost" href="#cat-fc" data-i18n="hero.start">开始游戏</a>
        </div>
        <div class="hero-marquee"><span>INSERT COIN · INSERT COIN · INSERT COIN · INSERT COIN</span></div>
      </div>
    </section>

    <div id="home-sections" class="container"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/i18n.js?v=20260926a"></script>
  <script src="js/data.js?v=20260925u"></script>
  <script src="js/layout.js?v=20260925a"></script>
  <script>
    function renderHome() {
      const wrap = document.getElementById('home-sections');
      wrap.innerHTML = '';

      // 个人专属推荐（最多 6 款，按设备确定性生成、每人不同）
      const personal = window.Personal.picks(SITE.GAMES, 6);
      if (personal.length) {
        const psec = document.createElement('section');
        psec.className = 'game-section personal-section';
        psec.innerHTML =
          `<div class="section-head">
             <h2><span class="cat-icon" style="--c:#ffd23f">★</span>${I18N.t('section.personal')}</h2>
             <span class="personal-sub">${I18N.t('personal.sub')}</span>
           </div>
           <div class="game-grid">${personal.map(cardHTML).join('')}</div>`;
        wrap.appendChild(psec);
      }

      SITE.CATEGORIES.forEach((cat) => {
        const games = SITE.byCat(cat.id).slice(0, 12);
        const sec = document.createElement('section');
        sec.className = 'game-section';
        sec.id = 'cat-' + cat.id;
        sec.innerHTML =
          `<div class="section-head">
             <h2><span class="cat-icon" style="--c:${cat.color}">${cat.icon}</span>${SITE.catLabel(cat.id)}</h2>
             <a class="more" href="list.html?cat=${cat.id}" data-i18n="section.more">更多</a>
           </div>
           <div class="game-grid">${games.map(cardHTML).join('')}</div>`;
        wrap.appendChild(sec);
      });
      I18N.apply();
    }

    renderChrome();
    renderHome();
    window.__onLang = renderHome;
  </script>
</body>
</html>

  <script>
    // 中/英版独立标题与描述，保证 ?lang=en 被抓取时呈现英文元数据
    const PAGE_META = {
      cn: {
        title: '在线FC/MD游戏大厅 | 小霸王网页模拟器',
        desc: '免费在线玩 FC 红白机与世嘉 MD 经典游戏，魂斗罗、双截龙、忍者龙剑传、火枪英雄等 50+ 款，网页即开即玩，支持键盘操作。',
        ogTitle: '在线FC/MD游戏大厅 | 小霸王网页模拟器',
        ogDesc: '免费在线玩 FC 红白机与世嘉 MD 经典游戏，50+ 款网页即玩。',
      },
      en: {
        title: 'Play FC & Sega MD Games Online | SUBOR Web Emulator',
        desc: 'Play classic NES/FC and Sega Mega Drive/MD games online for free — Contra, Double Dragon, Ninja Gaiden, Gunstar Heroes and 50+ titles. Instant play in your browser, keyboard supported.',
        ogTitle: 'Play FC & Sega MD Games Online | SUBOR Web Emulator',
        ogDesc: 'Play classic NES/FC and Sega MD games online — 50+ titles, instant browser play.',
      },
    };
    function applyLangMeta() {
      const m = PAGE_META[I18N.lang] || PAGE_META.cn;
      document.title = m.title;
      const set = (sel, c) => { const e = document.head.querySelector(sel); if (e) e.setAttribute('content', c); };
      set('meta[name="description"]', m.desc);
      set('meta[property="og:title"]', m.ogTitle);
      set('meta[property="og:description"]', m.ogDesc);
      set('meta[name="twitter:title"]', m.ogTitle);
      set('meta[name="twitter:description"]', m.ogDesc);
      set('meta[property="og:locale"]', I18N.lang === 'cn' ? 'zh_CN' : 'en_US');
    }

    function renderHome() {
      const wrap = document.getElementById('home-sections');
      wrap.innerHTML = '';

      // 个人专属推荐（最多 6 款，按设备确定性生成、每人不同）
      const personal = window.Personal.picks(SITE.GAMES, 6);
      if (personal.length) {
        const psec = document.createElement('section');
        psec.className = 'game-section personal-section';
        psec.innerHTML =
          `<div class="section-head">
             <h2><span class="cat-icon" style="--c:#ffd23f">★</span>${I18N.t('section.personal')}</h2>
             <span class="personal-sub">${I18N.t('personal.sub')}</span>
           </div>
           <div class="game-grid">${personal.map(cardHTML).join('')}</div>`;
        wrap.appendChild(psec);
      }

      SITE.CATEGORIES.forEach((cat) => {
        const games = SITE.byCat(cat.id).slice(0, 12);
        const sec = document.createElement('section');
        sec.className = 'game-section';
        sec.id = 'cat-' + cat.id;
        sec.innerHTML =
          `<div class="section-head">
             <h2><span class="cat-icon" style="--c:${cat.color}">${cat.icon}</span>${SITE.catLabel(cat.id)}</h2>
             <a class="more" href="list.html?cat=${cat.id}" data-i18n="section.more">更多</a>
           </div>
           <div class="game-grid">${games.map(cardHTML).join('')}</div>`;
        wrap.appendChild(sec);
      });
      I18N.apply();
      applyLangMeta();
    }

    renderChrome();
    renderHome();
    window.__onLang = renderHome;

    // ---- SEO 结构化数据：WebSite + 站内搜索 + 游戏 ItemList ----
    (function injectSEOLD() {
      const DOMAIN = 'https://www.webplaygame.tech';
      const games = SITE.GAMES.map((g, i) => ({
        '@type': 'ListItem', position: i + 1,
        item: {
          '@type': 'VideoGame',
          name: g.title.cn, alternateName: g.title.en,
          url: DOMAIN + '/play.html?id=' + g.id,
          image: DOMAIN + '/' + g.cover,
          genre: g.tags.cn,
          gamePlatform: g.cat === 'sfc' ? 'SNES/SFC' : (g.cat === 'arcade' ? 'Arcade' : (g.cat === 'fc' ? 'FC/NES' : 'MD/Genesis')),
        },
      }));
      const ld = [
        {
          '@context': 'https://schema.org', '@type': 'WebSite',
          name: '小霸王网页模拟器', url: DOMAIN + '/index.html',
          potentialAction: {
            '@type': 'SearchAction',
            target: DOMAIN + '/list.html?q={search_term_string}',
            'query-input': 'required name=search_term_string',
          },
        },
        {
          '@context': 'https://schema.org', '@type': 'ItemList',
          itemListElement: games,
        },
      ];
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify(ld);
      document.head.appendChild(s);
    })();
  </script>

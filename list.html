<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="list-head">
      <h1 class="list-title" id="listTitle" data-i18n="list.title">游戏列表</h1>

    <div class="cat-tabs" id="catTabs"></div>

    <p class="result-count" id="resultCount"></p>
    <div class="game-grid" id="listGrid"></div>
    <p class="empty" id="emptyState" style="display:none" data-i18n="list.empty">没有找到相关游戏，换个关键词试试。</p>

  <div id="site-footer"></div>

  <script src="js/i18n.js?v=20261001j"></script>
  <script src="js/data.js?v=20261001k"></script>
  <script src="js/layout.js?v=20260923b"></script>
  <script>
    // 中/英版独立标题与描述，保证 ?lang=en 被抓取时呈现英文元数据
    const PAGE_META = {
      cn: {
        title: '全部游戏列表 | 小霸王网页模拟器',
        desc: '浏览全部 FC 红白机与世嘉 MD 游戏，按机种分类，支持名称与标签搜索，点击即玩。',
        ogTitle: '全部游戏列表 | 小霸王网页模拟器',
        ogDesc: '浏览全部 FC 红白机与世嘉 MD 游戏，按机种分类，支持搜索，点击即玩。',
      },
      en: {
        title: 'All Games | SUBOR Web Emulator',
        desc: 'Browse all NES/FC and Sega Mega Drive/MD games, filter by platform, search by name or tag, and play instantly in your browser.',
        ogTitle: 'All Games | SUBOR Web Emulator',
        ogDesc: 'Browse all NES/FC and Sega MD games, filter by platform, search and play instantly.',
      },
    };
    function applyLangMeta() {
      const m = PAGE_META[I18N.lang] || PAGE_META.cn;
      document.title = m.title;
      const set = (sel, c) => { const e = document.head.querySelector(sel); if (e) e.setAttribute('content', c); };
      set('meta[name="description"]', m.desc);
      set('meta[property="og:title"]', m.ogTitle);
      set('meta[property="og:description"]', m.ogDesc);
      set('meta[name="twitter:title"]', m.ogTitle);
      set('meta[name="twitter:description"]', m.ogDesc);
      set('meta[property="og:locale"]', I18N.lang === 'cn' ? 'zh_CN' : 'en_US');
    }

    function getParams() {
      const p = new URLSearchParams(location.search);
      return { cat: p.get('cat') || '', q: p.get('q') || '' };
    }

    function renderTabs(activeCat) {
      const tabs = document.getElementById('catTabs');
      const all = `<a class="cat-tab ${!activeCat ? 'active' : ''}" href="list.html">${I18N.t('list.all')}</a>`;
      const rest = SITE.CATEGORIES.map((c) =>
        `<a class="cat-tab ${c.id === activeCat ? 'active' : ''}" href="list.html?cat=${c.id}">${SITE.catLabel(c.id)}</a>`
      ).join('');
      tabs.innerHTML = all + rest;
    }

    function renderList() {
      const { cat, q } = getParams();
      const titleEl = document.getElementById('listTitle');
      const grid = document.getElementById('listGrid');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('resultCount');

      renderTabs(cat);

      let list;
      if (q) {
        list = SITE.search(q);
        titleEl.textContent = '"' + q + '"';
      } else if (cat) {
        list = SITE.byCat(cat);
        titleEl.textContent = SITE.catLabel(cat);
      } else {
        list = SITE.GAMES.slice();
        titleEl.textContent = I18N.t('list.all');
      }

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        count.textContent = '';
      } else {
        empty.style.display = 'none';
        grid.innerHTML = list.map(cardHTML).join('');
        count.textContent = `${I18N.t('list.results')} ${list.length} ${I18N.t('list.games')}`;
      }
      I18N.apply();
      applyLangMeta();
    }

    renderChrome();
    renderList();
    window.__onLang = renderList;

    // ---- SEO 结构化数据：CollectionPage + 游戏 ItemList ----
    (function injectSEOLD() {
      const DOMAIN = 'https://www.webplaygame.tech';
      const games = SITE.GAMES.map((g, i) => ({
        '@type': 'ListItem', position: i + 1,
        item: {
          '@type': 'VideoGame',
          name: g.title.cn, alternateName: g.title.en,
          url: DOMAIN + '/play.html?id=' + g.id,
          image: DOMAIN + '/' + g.cover,
          genre: g.tags.cn,
          gamePlatform: g.cat === 'sfc' ? 'SNES/SFC' : (g.cat === 'arcade' ? 'Arcade' : (g.cat === 'fc' ? 'FC/NES' : 'MD/Genesis')),
        },
      }));
      const ld = [
        { '@context': 'https://schema.org', '@type': 'CollectionPage', name: '全部游戏列表', url: DOMAIN + '/list.html' },
        { '@context': 'https://schema.org', '@type': 'ItemList', itemListElement: games },
      ];
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify(ld);
      document.head.appendChild(s);
    })();
  </script>
</body>

    function applyLangMeta(cat) {
      const m = (cat && CAT_META[cat]) ? (CAT_META[cat][I18N.lang] || CAT_META[cat].cn) : (PAGE_META[I18N.lang] || PAGE_META.cn);
      document.title = m.title;
      const set = (sel, c) => { const e = document.head.querySelector(sel); if (e) e.setAttribute('content', c); };
      set('meta[name="description"]', m.desc);
      if (m.kw) set('meta[name="keywords"]', m.kw);
      set('meta[property="og:title"]', m.title);
      set('meta[property="og:description"]', m.desc);
      set('meta[name="twitter:title"]', m.title);
      set('meta[name="twitter:description"]', m.desc);
      set('meta[property="og:locale"]', I18N.lang === 'cn' ? 'zh_CN' : 'en_US');
      const DOMAIN = 'https://www.webplaygame.tech';
      const base = cat ? DOMAIN + '/list.html?cat=' + cat : DOMAIN + '/list.html';
      const urlEn = base + (cat ? '&lang=en' : '?lang=en');
      const upsertLink = (rel, hreflang, href) => {
        const sel = `link[rel="${rel}"]` + (hreflang ? `[hreflang="${hreflang}"]` : '');
        let el = document.head.querySelector(sel);
        if (!el) { el = document.createElement('link'); el.rel = rel; if (hreflang) el.hreflang = hreflang; document.head.appendChild(el); }
        el.href = href;
      };
      upsertLink('canonical', null, base);
      upsertLink('alternate', 'zh-CN', base);
      upsertLink('alternate', 'en', urlEn);
      upsertLink('alternate', 'x-default', base);
      set('meta[property="og:url"]', base);
    }

    function getParams() {
      const p = new URLSearchParams(location.search);
      return { cat: p.get('cat') || '', q: p.get('q') || '' };
    }

    function renderTabs(activeCat) {
      const tabs = document.getElementById('catTabs');
      const all = `<a class="cat-tab ${!activeCat ? 'active' : ''}" href="list.html">${I18N.t('list.all')}</a>`;
      const rest = SITE.CATEGORIES.map((c) =>
        `<a class="cat-tab ${c.id === activeCat ? 'active' : ''}" href="list.html?cat=${c.id}">${SITE.catLabel(c.id)}</a>`
      ).join('');
      tabs.innerHTML = all + rest;
    }

    function renderList() {
      const { cat, q } = getParams();
      const titleEl = document.getElementById('listTitle');
      const grid = document.getElementById('listGrid');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('resultCount');

      renderTabs(cat);

      let list;
      if (q) {
        list = SITE.search(q);
        titleEl.textContent = '"' + q + '"';
      } else if (cat) {
        list = SITE.byCat(cat);
        titleEl.textContent = SITE.catLabel(cat);
      } else {
        list = SITE.GAMES.slice();
        titleEl.textContent = I18N.t('list.all');
      }

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        count.textContent = '';
      } else {
        empty.style.display = 'none';
        grid.innerHTML = list.map(cardHTML).join('');
        count.textContent = `${I18N.t('list.results')} ${list.length} ${I18N.t('list.games')}`;
      }
      I18N.apply();
      applyLangMeta(cat);
    }

    renderChrome();
    renderList();
    window.__onLang = renderList;

    // ---- SEO 结构化数据：CollectionPage + 游戏 ItemList ----
    (function injectSEOLD() {
      const DOMAIN = 'https://www.webplaygame.tech';
      const _c = new URLSearchParams(location.search).get('cat') || '';
      const games = SITE.GAMES.map((g, i) => ({
        '@type': 'ListItem', position: i + 1,
        item: {
          '@type': 'VideoGame',
          name: g.title.cn, alternateName: g.title.en,
          url: DOMAIN + '/play.html?id=' + g.id,
          image: DOMAIN + '/' + g.cover,
          genre: g.tags.cn,
          gamePlatform: g.cat === 'sfc' ? 'SNES/SFC' : (g.cat === 'arcade' ? 'Arcade' : (g.cat === 'fc' ? 'FC/NES' : 'MD/Genesis')),
        },
      }));
      const ld = [
        { '@context': 'https://schema.org', '@type': 'CollectionPage', name: _c ? SITE.catLabel(_c) : '全部游戏列表', url: _c ? DOMAIN + '/list.html?cat=' + _c : DOMAIN + '/list.html' },
        { '@context': 'https://schema.org', '@type': 'ItemList', itemListElement: games },
      ];
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify(ld);
      document.head.appendChild(s);
    })();
